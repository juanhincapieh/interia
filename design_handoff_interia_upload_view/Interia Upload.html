<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Interia — New Project</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --warm-canvas: #F7F3EC;
    --soft-cream: #FBF8F2;
    --porcelain: #FFFFFF;
    --sand-border: #E7DED1;
    --sand-border-strong: #DAD0C0;
    --charcoal: #1F1F1C;
    --warm-gray: #6F6A61;
    --dust-gray: #9A9489;
    --sage: #5F7F63;
    --deep-sage: #49634D;
    --mist-sage: #E7EFE4;
    --terracotta: #C97855;
    --clay: #E9C7B3;
    --muted-gold: #C9A96A;
    --shadow-card: 0 12px 40px rgba(31,31,28,0.06);
    --shadow-float: 0 18px 60px rgba(31,31,28,0.12);
    --radius-card: 24px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--warm-canvas);
    color: var(--charcoal);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; cursor: pointer; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* Subtle warm grain over canvas */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1200px 600px at 88% 0%, rgba(201,120,85,0.05), transparent 60%),
      radial-gradient(900px 700px at -10% 100%, rgba(95,127,99,0.05), transparent 65%);
    z-index: 0;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

/* ---------- Icons (Lucide-style line icons, hand-rolled minimal) ---------- */
const Icon = ({ d, size = 20, stroke = 1.6, fill = "none", style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill}
       stroke="currentColor" strokeWidth={stroke}
       strokeLinecap="round" strokeLinejoin="round" style={style} aria-hidden="true">
    {d}
  </svg>
);

const IconPlus      = (p) => <Icon {...p} d={<><path d="M12 5v14"/><path d="M5 12h14"/></>} />;
const IconFolder    = (p) => <Icon {...p} d={<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>} />;
const IconSparkles  = (p) => <Icon {...p} d={<><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"/></>} />;
const IconGrid      = (p) => <Icon {...p} d={<><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>} />;
const IconSliders   = (p) => <Icon {...p} d={<><path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 12h4"/><path d="M12 12h8"/><circle cx="10" cy="12" r="2"/><path d="M4 18h10"/><path d="M18 18h2"/><circle cx="16" cy="18" r="2"/></>} />;
const IconGear      = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>} />;
const IconCloudUp   = (p) => <Icon {...p} d={<><path d="M16 16l-4-4-4 4"/><path d="M12 12v9"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></>} />;
const IconChevDown  = (p) => <Icon {...p} d={<path d="M6 9l6 6 6-6"/>} />;
const IconArrowRight= (p) => <Icon {...p} d={<><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></>} />;

/* Logo: small sparkle/diamond mark — kept simple as user will replace later */
const LogoMark = ({ size = 22 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2.5l2.2 6 6 2.2-6 2.2L12 19l-2.2-6.1L3.8 10.7l6-2.2L12 2.5z"
          fill="var(--sage)" />
    <circle cx="12" cy="10.7" r="1.4" fill="var(--warm-canvas)" />
  </svg>
);

/* ---------- Sidebar ---------- */
const NAV_ITEMS = [
  { id: "new",         label: "New Project",  Icon: IconPlus,      active: true },
  { id: "projects",    label: "Projects",     Icon: IconFolder },
  { id: "inspiration", label: "Inspiration",  Icon: IconSparkles },
  { id: "catalog",     label: "Catalog",      Icon: IconGrid },
  { id: "preferences", label: "Preferences",  Icon: IconSliders },
];

function Sidebar() {
  return (
    <aside style={sidebarStyles.root}>
      <div style={sidebarStyles.logoRow}>
        <LogoMark />
        <span style={sidebarStyles.logoText}>interia</span>
        <span style={sidebarStyles.logoPlaceholder} title="Logo placeholder — replace later">
          placeholder
        </span>
      </div>

      <nav style={sidebarStyles.nav}>
        {NAV_ITEMS.map(({ id, label, Icon: I, active }) => (
          <button key={id}
                  style={{
                    ...sidebarStyles.navItem,
                    ...(active ? sidebarStyles.navItemActive : null),
                  }}>
            <I size={18} />
            <span>{label}</span>
            {active && (
              <span style={sidebarStyles.activeDot} />
            )}
          </button>
        ))}
      </nav>

      <div style={sidebarStyles.spacer} />

      <button style={{ ...sidebarStyles.navItem, color: "var(--warm-gray)" }}>
        <IconGear size={18} />
        <span>Settings</span>
      </button>

      <div style={sidebarStyles.workspaceCard}>
        <div style={sidebarStyles.workspaceLabel}>Workspace</div>
        <div style={sidebarStyles.workspaceName}>Laura's Studio</div>
        <div style={sidebarStyles.workspaceMeta}>
          <span style={{ ...sidebarStyles.dot, background: "var(--terracotta)" }} />
          3 active projects
        </div>
      </div>
    </aside>
  );
}

const sidebarStyles = {
  root: {
    width: 248,
    minWidth: 248,
    height: "100vh",
    background: "var(--soft-cream)",
    borderRight: "1px solid var(--sand-border)",

    flexDirection: "column",

    zIndex: 1,
  },

  },
  activeDot: {
    marginLeft: "auto",
    width: 6, height: 6, borderRadius: 999,
    background: "var(--sage)",
  },
  spacer: { flex: 1 },
  workspaceCard: {
    marginTop: 14,
    padding: "12px 14px",
    background: "var(--porcelain)",
    border: "1px solid var(--sand-border)",
    borderRadius: 14,
  },
  workspaceLabel: {
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 10,
    color: "var(--dust-gray)",
    textTransform: "uppercase",
    letterSpacing: "0.1em",
    marginBottom: 4,
  },
  workspaceName: {
    fontSize: 14,
    fontWeight: 600,
    color: "var(--charcoal)",
  },
  workspaceMeta: {
    marginTop: 6,
    display: "flex",
    alignItems: "center",
    gap: 6,
    fontSize: 12,
    color: "var(--warm-gray)",
  },
  dot: { width: 6, height: 6, borderRadius: 999, display: "inline-block" },
};

/* ---------- Top user pill ---------- */
function TopUserMenu() {
  return (
    <div style={topStyles.row}>
      <div style={topStyles.statusPill}>
        <span style={topStyles.statusDot} />
        <span>Agent online</span>
      </div>

      <button style={topStyles.userPill}>
        <span style={topStyles.avatar}>
          {/* Avatar placeholder — initials */}
          <span style={topStyles.avatarInitials}>L</span>
        </span>
        <span style={{ color: "var(--charcoal)", fontWeight: 600 }}>Hi, Laura</span>
        <IconChevDown size={16} style={{ color: "var(--warm-gray)" }} />
      </button>
    </div>
  );
}

const topStyles = {
  row: {
    position: "absolute",
    top: 24, right: 32,
    display: "flex", alignItems: "center", gap: 10,
    zIndex: 5,
  },
  statusPill: {
    display: "flex", alignItems: "center", gap: 8,

  },

  avatar: {

    background: "linear-gradient(135deg, #E9C7B3, #C97855)",
    color: "white",
    display: "inline-flex", alignItems: "center", justifyContent: "center",
    fontSize: 13, fontWeight: 600,
    border: "1px solid rgba(255,255,255,0.6)",
  },
  avatarInitials: { color: "white", fontWeight: 700, letterSpacing: 0 },
};

/* ---------- Hero ---------- */
function HeroIntro() {
  return (
    <div style={heroStyles.root}>
      <div style={heroStyles.pill}>
        <IconSparkles size={13} style={{ color: "var(--sage)" }} />
        <span>Agent-generated design workspace</span>
      </div>

      <h1 style={heroStyles.title}>
        Design your space,<br />
        <span style={{ color: "var(--sage)" }}>interactively.</span>
      </h1>

      <p style={heroStyles.subtitle}>
        Upload a photo of your room and let Interia turn it into an
        editable design state.
      </p>
    </div>
  );
}

const heroStyles = {
  root: { maxWidth: 480 },
  pill: {
    display: "inline-flex", alignItems: "center", gap: 8,
    padding: "6px 12px",
    background: "var(--soft-cream)",

    fontSize: 12.5,
    color: "var(--warm-gray)",

  },

    fontWeight: 400,

};

/* ---------- Upload Card ---------- */
function RoomUploadCard() {
  const [hover, setHover] = useState(false);
  return (
    <div
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        ...uploadStyles.card,
        borderColor: hover ? "rgba(95,127,99,0.45)" : "var(--sand-border)",
        boxShadow: hover
          ? "0 18px 50px rgba(95,127,99,0.14), 0 0 0 4px rgba(231,239,228,0.6)"
          : "var(--shadow-card)",
      }}
    >
      <div style={uploadStyles.dashedInner}>
        <div style={uploadStyles.iconWrap}>
          <IconCloudUp size={26} style={{ color: "var(--charcoal)" }} />
        </div>

        <div style={uploadStyles.title}>Upload a room photo</div>
        <div style={uploadStyles.sub}>or drag and drop</div>

        <div style={uploadStyles.btnRow}>
          <button style={uploadStyles.primaryBtn}>
            Choose image
            <IconArrowRight size={15} />
          </button>
          <span style={uploadStyles.hint}>JPG, PNG up to 20MB</span>
        </div>
      </div>
    </div>
  );
}

/* ---------- Sample Rooms ---------- */
const SAMPLE_ROOMS = [
  { id: "bedroom",   label: "Bedroom",     img: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=400&q=80&auto=format&fit=crop" },
  { id: "studio",    label: "Studio",      img: "https://images.unsplash.com/photo-1567016432779-094069958ea5?w=400&q=80&auto=format&fit=crop" },
  { id: "living",    label: "Living room", img: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400&q=80&auto=format&fit=crop" },
  { id: "workspace", label: "Workspace",   img: "https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?w=400&q=80&auto=format&fit=crop" },
];

function SampleRoomSelector() {
  const [selected, setSelected] = useState("bedroom");
  return (
    <div style={sampleStyles.root}>
      <div style={sampleStyles.divider}>
        <span style={sampleStyles.line} />
        <span style={sampleStyles.dividerLabel}>or try a sample room</span>
        <span style={sampleStyles.line} />
      </div>

      <div style={sampleStyles.grid}>
        {SAMPLE_ROOMS.map(r => (
          <button
            key={r.id}
            onClick={() => setSelected(r.id)}
            style={{
              ...sampleStyles.thumb,
              borderColor: selected === r.id ? "var(--sage)" : "var(--sand-border)",
              boxShadow: selected === r.id
                ? "0 0 0 3px rgba(231,239,228,0.9)"
                : "0 4px 14px rgba(31,31,28,0.04)",
            }}
            aria-label={r.label}
          >
            <img src={r.img} alt={r.label} style={sampleStyles.img}
                 onError={(e) => { e.currentTarget.style.display = 'none'; }} />
            <div style={sampleStyles.thumbLabel}>{r.label}</div>
            {selected === r.id && (
              <span style={sampleStyles.selectedDot}>
                <span style={sampleStyles.selectedDotInner} />
              </span>
            )}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------- Room Preview ---------- */
function HeroRoomPreview() {
  return (
    <div style={previewStyles.root}>
      <div style={previewStyles.frame}>
        <img
          src="https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=1400&q=85&auto=format&fit=crop"
          alt="Sample bedroom"
          style={previewStyles.img}

        {/* Top-right step badge */}

        {/* Source label */}
        <div style={previewStyles.sourceLabel}>
          <span style={previewStyles.sourceDot} />
          <span>Source room · sample</span>
        </div>

        {/* Decorative corner ticks (subtle agentic hint) */}
        <Tick style={{ top: 18, left: 18, transform: "rotate(0deg)" }} />
